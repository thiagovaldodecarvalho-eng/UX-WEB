<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Transform-Skew.css">
    <title>Transform and Skew</title>
</head>
<style>
    a:hover{text-decoration:overline;
    color:salmon;
    font-size:150%;
    }
</style>
<body>
    <img src="Femass Logo.jpg" style="transform: scale(0.5) rotate(20deg);" align="left">
    <img src="Femass Logo.jpg" style="transform: scale(0.5) skewx(50deg);" align="center">
    <img src="Femass Logo.jpg" style="transform: scale(0.5) skewy(30deg);" align="right">
    <h3>As imagens estão com 50% do seu tamanho</h3>
    <h3>A primeira está a esquerda e rotacionado em 20deg</h3>
    <h3>A segunda está centralizada e distorcida no eixo X em 50deg</h3>
    <h3>A terceira está a direita e distorcida no eixo Y em 30deg</h3>
    <a href="Index.html" align="bottom"> Retornar à página Principal </a>
</body>
</html>
